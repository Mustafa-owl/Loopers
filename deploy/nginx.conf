# nginx in front of Erbil Utilities. Copy to /etc/nginx/sites-available/,
# change the server_name, link it into sites-enabled, then get a
# certificate with:  sudo certbot --nginx -d erbil-utilities.example

# The access log keeps internet addresses cut short (the last part becomes
# 0) and the path without its query string, which can carry the last digits
# of a phone number. Ubuntu's logrotate keeps 14 days of it, which is what
# the privacy page says. Change one, change the other.
map $remote_addr $short_addr {
    ~^(?P<a>\d+\.\d+\.\d+)\.\d+$   $a.0;
    ~^(?P<b>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):   $b::;
    default                              -;
}
log_format short '$short_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name erbil-utilities.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erbil-utilities.example;

    # certbot fills these in
    # ssl_certificate     /etc/letsencrypt/live/erbil-utilities.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/erbil-utilities.example/privkey.pem;

    access_log /var/log/nginx/erbil-utilities.log short;
    client_max_body_size 2m;          # photos are at most 1.5 MB
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    # live updates: keep the line open and don't hold anything back
    location ~ ^/api/(team/)?live$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
